services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consultahoy_app
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: app
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-consultahoy}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_GENERAL: ${RATE_LIMIT_GENERAL:-60}
      RATE_LIMIT_CALCULADORAS: ${RATE_LIMIT_CALCULADORAS:-30}
      RATE_LIMIT_RUC: ${RATE_LIMIT_RUC:-20}
      RATE_LIMIT_DNI: ${RATE_LIMIT_DNI:-5}
      DNI_ENABLED: ${DNI_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${PORT:-8000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: consultahoy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-consultahoy}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-consultahoy}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: consultahoy_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data_v2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_v3:
  redis_data_v2:
  redis_data_v2:
